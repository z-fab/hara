[project]
name = "hara"
version = "0.1.0"
description = "Hybrid Agent for Retrieval and Answering — open source multi-agent for hybrid SQL+document Q&A"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Fabricio Zillig" },
]

dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "openai>=1.50",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "polars>=1.0",
    "sqlglot>=25.0",
    "rich>=13.0",
    "typer>=0.12",
    "structlog>=24.0",
    "aiosqlite>=0.20",
    "numpy>=1.26",
    "python-slugify>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
postgres = ["asyncpg>=0.29"]
chromadb = ["chromadb>=0.5"]
anthropic = ["langchain-anthropic>=0.2"]
google = ["langchain-google-genai>=2.0"]
docling = ["docling>=2.0"]
all = ["hara[api,postgres,chromadb,anthropic,google,docling]"]

[project.scripts]
hara = "hara.cli.app:app"

[project.entry-points."hara.connectors.sql"]
sqlite = "hara.connectors.sql.sqlite:SQLiteConnector"
postgres = "hara.connectors.sql.postgres:PostgresConnector"
memory = "hara.connectors.sql.memory:MemorySQLConnector"

[project.entry-points."hara.connectors.vector"]
chromadb = "hara.connectors.vector.chromadb:ChromaDBConnector"
memory = "hara.connectors.vector.memory:MemoryVectorConnector"

[project.entry-points."hara.providers.llm"]
openai = "hara.providers.llm.openai:OpenAIProvider"
anthropic = "hara.providers.llm.anthropic:AnthropicProvider"
google = "hara.providers.llm.google:GoogleProvider"
openrouter = "hara.providers.llm.openrouter:OpenRouterProvider"
ollama = "hara.providers.llm.ollama:OllamaProvider"

[project.entry-points."hara.providers.embeddings"]
openai = "hara.providers.embeddings.openai:OpenAIEmbeddingsProvider"
google = "hara.providers.embeddings.google:GoogleEmbeddingsProvider"
ollama = "hara.providers.embeddings.ollama:OllamaEmbeddingsProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hara"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "pyright>=1.1",
    "testcontainers[postgres]>=4.0",
    "httpx>=0.27",
    "types-pyyaml>=6.0",
    "fpdf2>=2.8.7",
    "python-docx>=1.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF",
    "S", "T20", "TID", "PT", "RET", "ARG", "ERA", "PL",
]
ignore = ["PLR0913", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "PLR2004", "ARG"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__"]
strict = ["src/hara"]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportPrivateUsage = "warning"
pythonVersion = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: marks tests that hit real LLM APIs (deselect with '-m \"not live\"')",
    "contract: marks contract tests for connectors",
    "integration: marks integration tests requiring docker",
]
